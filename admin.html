<!doctype html><html lang="ru"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ForgeLib — Admin</title><link rel="stylesheet" href="styles.css"></head><body><header class="header"><a class="brand" href="index.html">Forge<span>Lib</span></a><nav class="nav"><a href="index.html">Каталог</a><a href="index.html#premium">Premium</a></nav><div class="header-actions"><button class="ghost-btn" id="langBtn">EN</button><button class="ghost-btn" id="themeBtn">◐</button></div></header><main class="admin-main"><div class="admin-head"><div><div class="eyebrow">LOCAL ADMIN</div><h1>Управление каталогом</h1><p class="section-lead">Локальный инструмент v0.6. Изменения сохраняются в браузере через localStorage.</p></div><div class="admin-actions"><button class="secondary-btn" id="resetCatalog">Сбросить к исходному</button><button class="primary-btn" id="newResource">+ Новый ресурс</button></div></div><div class="admin-grid"><section class="admin-panel"><div class="panel-head"><h2>Ресурсы</h2><span id="adminCount" class="muted"></span></div><div id="adminList" class="admin-list"></div></section><section class="admin-panel" id="editorPanel"><div class="panel-head"><h2 id="editorTitle">Новый ресурс</h2></div><form id="resourceForm" class="resource-form"><input type="hidden" id="fId"><label>Название <input id="fTitle" required></label><div class="form-row"><label>Категория <input id="fCategory" required></label><label>Тип <select id="fType"><option value="free">Free</option><option value="premium">Premium</option></select></label></div><div class="form-row"><label>Цена <input id="fPrice" type="number" min="0" value="0"></label><label>Лицензия <input id="fLicense" value="Free"></label></div><div class="form-row"><label>Формат <input id="fFormat" required></label><label>Размер <input id="fSize" value="1 MB"></label></div><label>Описание RU <textarea id="fDescRu" required></textarea></label><label>Описание EN <textarea id="fDescEn" required></textarea></label><label>Детали RU <textarea id="fDetailsRu"></textarea></label><label>Детали EN <textarea id="fDetailsEn"></textarea></label><div class="form-row"><label>Автор <input id="fAuthor" value="ForgeLib"></label><label>Дата <input id="fUpdated" type="date"></label></div><label>Теги через запятую <input id="fTags" placeholder="UI, Web, Starter"></label><label>Файл / путь <input id="fFile" placeholder="downloads/example.zip"></label><label>Иконка <input id="fIcon" value="◆"></label><div class="form-actions"><button type="button" class="secondary-btn" id="cancelEdit">Отмена</button><button class="primary-btn" type="submit">Сохранить ресурс</button></div></form></section></div><section class="admin-panel import-panel"><div class="panel-head"><h2>Импорт / экспорт</h2></div><p class="muted">Экспорт сохраняет текущий каталог в JSON. Импорт заменяет локальный каталог в браузере.</p><div class="form-actions"><button class="secondary-btn" id="exportBtn">Экспорт JSON</button><label class="file-btn">Импорт JSON<input id="importFile" type="file" accept="application/json"></label></div></section></main><script src="data/catalog.js"></script><script src="admin.js"></script></body></html>
